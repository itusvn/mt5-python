<!-- templates/trading/modals/new_order_modal.html -->
<div class="modal fade" id="newOrderModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="newOrderForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label>Symbol</label>
                                <select class="form-select" id="orderSymbol" required>
                                    {% for symbol in symbols %}
                                    <option value="{{ symbol.name }}">{{ symbol.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label>Type</label>
                                <select class="form-select" id="orderType" required>
                                    <option value="BUY">Buy</option>
                                    <option value="SELL">Sell</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label>Volume</label>
                                <input type="number" class="form-control" id="orderVolume" 
                                       step="0.01" min="0.01" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label>Risk %</label>
                                <input type="number" class="form-control" id="riskPercent" 
                                       value="2" min="0.1" max="5" step="0.1">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label>Stop Loss</label>
                                <input type="number" class="form-control" id="orderSL" 
                                       step="0.00001">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label>Take Profit</label>
                                <input type="number" class="form-control" id="orderTP" 
                                       step="0.00001">
                            </div>
                        </div>
                    </div>

                    <!-- AI Models Selection -->
                    <div class="mb-3">
                        <label>AI Models</label>
                        <div class="row">
                            {% for model in active_models %}
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           name="selectedModels" value="{{ model.id }}"
                                           id="model{{ model.id }}">
                                    <label class="form-check-label" for="model{{ model.id }}">
                                        {{ model.name }} ({{ model.accuracy }}%)
                                    </label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>
</div>
