<!-- templates/dashboard/widgets/market_watch.html -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Market Watch</h5>
        <div class="btn-group">
            <button class="btn btn-sm btn-outline-secondary" onclick="refreshMarketWatch()">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" 
                    data-bs-target="#symbolSettingsModal">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover market-watch-table mb-0">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Bid</th>
                        <th>Ask</th>
                        <th>Change</th>
                    </tr>
                </thead>
                <tbody id="marketWatchBody">
                    {% for symbol in market_watch %}
                    <tr data-symbol="{{ symbol.name }}" class="symbol-row">
                        <td>
                            {{ symbol.name }}
                            <small class="d-block text-muted">{{ symbol.display_name }}</small>
                        </td>
                        <td class="bid">{{ symbol.bid|floatformat:5 }}</td>
                        <td class="ask">{{ symbol.ask|floatformat:5 }}</td>
                        <td class="change {% if symbol.change >= 0 %}text-success{% else %}text-danger{% endif %}">
                            {{ symbol.change|floatformat:2 }}%
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
